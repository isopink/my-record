<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAG-finetuning</title>
<meta name="description" content="RAG-finetuning. Details to come.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
--color-paper:#fff;--color-paper-2:oklch(94% 0 0);
--color-ink:#000;--color-ink-2:oklch(20% 0 0);--color-muted:oklch(32% 0 0);--color-soft:oklch(48% 0 0);
--color-rule:oklch(0% 0 0 / 0.9);--color-rule-2:oklch(0% 0 0 / 0.28);
--color-accent-ink:#fff;--color-focus:#000;
--font-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,monospace;
--text-display:clamp(2.25rem,5vw,4rem);--text-section:clamp(1.5rem,2.4vw,2rem);--text-lead:1.25rem;--text-md:1rem;--text-sm:0.875rem;
--space-xs:0.5rem;--space-sm:0.75rem;--space-md:1rem;--space-lg:1.5rem;--space-xl:2rem;--space-2xl:3rem;--space-3xl:4.5rem;
--container:72rem;--gutter:clamp(1rem,4.4vw,4rem);
color-scheme:light;
}
html,body{overflow-x:clip}
*{box-sizing:border-box}
body{margin:0;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-body);font-size:var(--text-md);line-height:1.6}
a{color:var(--color-ink);text-decoration-thickness:1px;text-underline-offset:0.2em}
a:hover{text-decoration-color:transparent}
a:focus-visible{outline:2px solid var(--color-focus);outline-offset:3px}
::selection{background:var(--color-ink);color:var(--color-accent-ink)}
.wrap{max-width:var(--container);margin-inline:auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.top{padding-block:var(--space-xl) var(--space-2xl);display:flex;flex-direction:column;align-items:flex-start;row-gap:var(--space-md)}
.back{display:inline-flex;align-items:center;min-height:3rem;font-size:var(--text-sm);font-weight:500}
.field{margin:var(--space-md) 0 0;font-size:var(--text-sm);font-weight:500;color:var(--color-muted)}
.kind{margin-left:var(--space-sm);padding:0 0.375rem;border:1px solid var(--color-rule-2);font-size:0.75rem}
h1{margin:0;font-size:var(--text-display);font-weight:600;line-height:1.05;letter-spacing:-0.022em;text-wrap:balance;overflow-wrap:break-word;min-width:0}
.paper-title{font-size:clamp(1.75rem,3.4vw,2.75rem);line-height:1.15;max-width:30ch}
.lead{margin:0;max-width:40ch;font-size:var(--text-lead);line-height:1.4;color:var(--color-ink-2);text-wrap:pretty}
.facts{margin:var(--space-md) 0 0;width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-md) var(--space-xl);border-top:1px solid var(--color-rule-2);padding-top:var(--space-md)}
.facts:empty{display:none}
.tags{margin:var(--space-md) 0 0;padding:var(--space-md) 0 0;width:100%;list-style:none;display:flex;flex-wrap:wrap;gap:var(--space-xs) var(--space-md);border-top:1px solid var(--color-rule-2)}
.tags li{font-size:var(--text-sm);font-weight:500;color:var(--color-ink-2)}
.facts dt{font-size:var(--text-sm);font-weight:500;color:var(--color-muted)}
.facts dd{margin:0;font-size:0.9375rem;color:var(--color-ink-2)}
.titlerow{display:flex;flex-wrap:wrap;align-items:center;column-gap:var(--space-md);row-gap:var(--space-xs)}
.gh{display:inline-flex;width:clamp(1.75rem,3.2vw,2.75rem);height:clamp(1.75rem,3.2vw,2.75rem);color:var(--color-ink)}
.gh svg{width:100%;height:100%}
.gh:hover{opacity:.6}
.gh:focus-visible{outline:2px solid var(--color-focus);outline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:var(--space-sm)}
.actions:empty{display:none}
.btn{display:inline-flex;align-items:center;height:3rem;padding-inline:var(--space-lg);border:1px solid var(--color-ink);font-weight:500;text-decoration:none;white-space:nowrap}
.btn:first-child{background:var(--color-ink);color:var(--color-accent-ink)}
.fig{margin:0;display:flex;flex-direction:column;row-gap:var(--space-xs)}
.fig img,.fig video{display:block;width:100%;height:auto;border:1px solid var(--color-rule-2);background:var(--color-paper-2)}
.fig figcaption{font-size:var(--text-sm);color:var(--color-muted)}
.fig img,.fig video{max-height:80svh;object-fit:contain}
.fig.lead{align-items:center}
.fig.lead img,.fig.lead video{width:auto;max-width:100%;max-height:78svh}
.kv{margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-sm) var(--space-xl)}
.kv dt{font-size:var(--text-sm);font-weight:500;color:var(--color-muted)}
.kv dd{margin:0;color:var(--color-ink-2);font-size:0.9375rem}
@media (max-width:48rem){.kv{grid-template-columns:minmax(0,1fr)}}
.part{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);column-gap:var(--space-2xl);padding-block:var(--space-3xl);border-bottom:1px solid var(--color-rule-2);scroll-margin-top:3.5rem}
.part h2{margin:0;font-size:var(--text-section);font-weight:600;line-height:1.15;letter-spacing:-0.015em}
.part-body{min-width:0;display:flex;flex-direction:column;row-gap:var(--space-lg)}
.part-body p,.part-body li{max-width:68ch;color:var(--color-ink-2)}
.part-body p{margin:0}
.part-body > p:first-child{font-size:1.125rem;line-height:1.5;color:var(--color-ink)}
.part-body ol,.part-body ul{margin:0;padding-left:1.25em;display:flex;flex-direction:column;row-gap:var(--space-sm)}
.part-body h3{margin:var(--space-md) 0 0;font-size:1.125rem;font-weight:600}
.part-body code{font-family:var(--font-mono);font-size:0.8125rem;color:var(--color-muted);overflow-wrap:anywhere}
.part-body blockquote{margin:0;padding-left:var(--space-md);border-left:1px solid var(--color-rule-2);color:var(--color-ink-2)}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:0.9375rem;font-variant-numeric:tabular-nums}
th,td{padding:var(--space-sm) var(--space-md) var(--space-sm) 0;border-bottom:1px solid var(--color-rule-2);text-align:left;vertical-align:top}
th{font-size:var(--text-sm);font-weight:500;color:var(--color-muted)}
td:first-child{font-weight:600;color:var(--color-ink);white-space:nowrap}
.paper .part-body > p:first-child{font-size:var(--text-md);color:var(--color-ink-2)}
.intro p{max-width:68ch;color:var(--color-ink-2)}
.foot{padding-block:var(--space-2xl)}
@media (max-width:48rem){
.part{grid-template-columns:minmax(0,1fr);row-gap:var(--space-lg);padding-block:var(--space-2xl)}
.facts{grid-template-columns:minmax(0,1fr)}
td:first-child{white-space:normal}
}
.show{position:relative;display:flex;flex-direction:column;align-items:center;row-gap:var(--space-xs)}
.show .track{display:flex;width:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.show .track::-webkit-scrollbar{display:none}
.show .slide{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;row-gap:var(--space-xs);margin:0}
.show .slide img,.show .slide video{display:block;width:auto;max-width:100%;max-height:160svh;border:1px solid var(--color-rule-2);background:var(--color-paper-2)}
.show .slide figcaption{font-size:var(--text-sm);color:var(--color-muted)}
.show .bar{display:flex;align-items:center;gap:var(--space-md);font-size:var(--text-sm);color:var(--color-muted)}
.show button{border:1px solid var(--color-rule-2);background:none;color:var(--color-ink);font:inherit;width:2.5rem;height:2.5rem;cursor:pointer}
.show button:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
</style>
</head>
<body>
<header class="wrap top">
<a class="back" href="../../index.html#work">All work</a>
<p class="field">Data</p>
<h1>RAG-finetuning</h1>
<p class="lead">Details to come.</p>
<div class="actions"></div>
</header>

<main class="wrap">
<section class="part" id="overview"><h2>Overview</h2><div class="part-body"><p>This page is a placeholder. The write-up is in progress.</p></div></section>
</main>
<footer class="wrap foot"><a class="back" href="../../index.html#work">All work</a></footer>
</body>
</html>
